<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7b4d25">
  <title>聖經目錄大挑戰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="book-icon" aria-hidden="true">📖</div>
      <p class="eyebrow">BIBLE BOOKS CHALLENGE</p>
      <h1>聖經目錄大挑戰</h1>
      <p class="subtitle">用選擇題認識聖經 66 卷書</p>
    </header>

    <section id="setup" class="panel setup-panel">
      <h2>準備開始挑戰</h2>
      <p class="muted">選擇抽考範圍與題數，系統會隨機出題，每回合不重複。</p>
      <div class="setting-grid">
        <label>遊戲模式
          <select id="game-mode">
            <option value="order">目錄順序填空</option>
            <option value="category">書卷分類配對</option>
          </select>
        </label>
        <label>抽考範圍
          <select id="scope">
            <option value="all">新舊約混合（66 卷）</option>
            <option value="old">舊約（39 卷）</option>
            <option value="new">新約（27 卷）</option>
          </select>
        </label>
        <label>難度
          <select id="difficulty">
            <option value="easy">簡單</option>
            <option value="normal" selected>普通</option>
            <option value="hard">困難</option>
          </select>
        </label>
        <label>每回合題數
          <select id="question-count">
            <option>10</option><option selected>20</option><option>30</option>
            <option>40</option><option>50</option><option>66</option>
          </select>
        </label>
      </div>
      <button id="start-btn" class="primary wide">開始抽考 <span>→</span></button>
    </section>

    <section id="quiz" class="panel quiz-panel hidden">
      <div class="quiz-top">
        <span id="scope-label" class="tag">混合抽考</span>
        <span id="progress-label" class="muted">第 1 / 20 題</span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="question-heading">
        <p id="question-hint" class="muted">請選出空格中正確的聖經書卷</p>
        <h2 id="question-title">以下目錄中，缺少的是哪一卷？</h2>
      </div>
      <div id="book-list" class="book-list"></div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback hidden" aria-live="polite"></div>
      <button id="next-btn" class="primary wide hidden">下一題 →</button>
      <button id="quit-btn" class="text-btn">結束本回合</button>
    </section>

    <section id="result" class="panel result-panel hidden">
      <div class="result-medal">🏆</div>
      <p class="eyebrow">CHALLENGE COMPLETED</p>
      <h2>本回合挑戰完成！</h2>
      <div class="score-circle"><strong id="score">0</strong><span>分</span></div>
      <div class="stats">
        <div><strong id="correct-count">0</strong><span>答對</span></div>
        <div><strong id="wrong-count">0</strong><span>答錯</span></div>
        <div><strong id="accuracy">0%</strong><span>正確率</span></div>
      </div>
      <p id="result-message" class="result-message"></p>
      <div id="wrong-review" class="wrong-review hidden">
        <h3>本回合錯題</h3>
        <div id="wrong-list"></div>
        <button id="retry-wrong-btn" class="secondary wide">只重練錯題</button>
      </div>
      <button id="again-btn" class="primary wide">再挑戰一次</button>
      <button id="home-btn" class="text-btn">返回開始畫面</button>
    </section>
    <footer>聖經目錄大挑戰 · 單人練習版</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
